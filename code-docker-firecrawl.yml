# code-docker overlay that attaches a self-hosted Firecrawl (scrape/crawl-to-markdown
# API, https://github.com/firecrawl/firecrawl) as an agent-usable tool.
#
# AIO design (2026-09-28): `firecrawl` below is ONE container - postgres, redis,
# playwright-service and the api harness all run as supervisord programs inside it (see
# ../Dockerfile and ../CLAUDE.md), Nextcloud-AIO style, replacing the previous
# seven-container stack (firecrawl-api, playwright-service, redis, rabbitmq, nuq-postgres,
# firecrawl-dns, firecrawl-front). rabbitmq is gone entirely (nuq's postgres LISTEN/NOTIFY
# wait mode replaces it, see ../config/supervisor/firecrawl-service.sh); the DNS forwarder
# sidecar is gone too (the AIO container runs dns-local itself, the same in-container
# program code-docker-chrome uses, now that there's a supervisord to hang it off of).
#
# Deliberately no standalone docker-compose.yml, same asymmetry as code-docker-trilium:
# running Firecrawl on its own needs nothing this repo adds.
#
# code-docker's own extra-include.yml -> this file, via the EXTRA_INCLUDE chain.
# `docker compose -f code-docker-firecrawl.yml up` on its own fails: code-docker-internal
# and code-docker-router are defined only in code-docker's own docker-compose.yml, which
# has to be part of the same include chain.
#
# ## The shape
#
#   code-docker-internal                      firecrawl (internal: true)
#      code-docker ---> firecrawl-front:3002 --->  firecrawl (AIO: postgres, redis,
#           (agent)     (plain network bridge,      playwright, api harness, dns-local,
#                        no auth logic of its own -  nginx bearer-token gate) (routed,
#                        the AIO container's own     netinit.provider)
#                        nginx-gate does the check)
#                              |                            |
#                              +-------- code-docker-router (netinit.gateway AND the
#                                        second DNS upstream dns-local forwards to)
#
# - Only `firecrawl` (the AIO container) carries the `netinit.provider` label - it's the
#   only fetcher left. `firecrawl-front` needs no route of its own: it only ever talks to
#   its two network peers (code-docker on one side, firecrawl on the other), never out to
#   the internet.
# - `firecrawl-front` is the only thing on BOTH networks. It used to also be the bearer-
#   token gate (see the old ../CLAUDE.md, still worth reading for the DNS-SERVFAIL
#   writeup); that check now lives inside the AIO container's own nginx-gate supervisord
#   program instead (see ../config/supervisor/nginx-gate-service.sh), because the AIO
#   design put a real process manager inside the fetcher container for the first time -
#   the same thing dns-local already took advantage of. firecrawl-front is now a plain
#   proxy_pass bridge with no auth logic of its own.
#
#   TODO: whether a separate bridge container is still the right shape here - versus
#   putting the AIO container directly on code-docker-internal (letting its own gate do
#   the whole job with no second hop), or exposing it through a router vhost instead - is
#   intentionally left open; see ../CLAUDE.md and ../docker/firecrawl-proxy/entrypoint.sh.
# - The `firecrawl` network no longer needs a pinned subnet or `ip_range`: those existed
#   only for the old firecrawl-dns sidecar's static, Compose-`dns:`-field-compatible
#   address, which doesn't exist anymore (dns-local resolves the AIO container's own
#   /etc/resolv.conf directly, from inside it, needing no network-visible fixed IP at
#   all). Docker's usual auto-assigned subnet is fine now.
# - Upstream's `extra_hosts: host.docker.internal:host-gateway` is still deliberately
#   dropped, and the experimental `foundationdb`/`foundationdb-init` services are still
#   skipped - see ../CLAUDE.md.

services:
  firecrawl:
    build:
      # Relative to this file, i.e. this repo's root, wherever ootb cloned it.
      context: .
    container_name: "${PREFIX:-}code-docker-firecrawl"
    restart: unless-stopped
    cap_drop: [ALL]
    # See ../CLAUDE.md's capability accounting table for the full reasoning; short
    # version:
    #  - CHOWN: entrypoint.sh chowns the postgres data volume (and /var/run/postgresql)
    #    to the `postgres` user on first boot - a fresh named volume starts root-owned.
    #  - SETUID/SETGID: supervisord runs as root and drops each program to its own
    #    unprivileged user (postgres, redis, node - see config/supervisord.d/*.conf).
    #  - NET_BIND_SERVICE: dns-local's dnsmasq binds 127.0.0.1:53 (a privileged port)
    #    while running as root, same as code-docker-chrome's own dns-local.
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    # Opt-in label for code-docker-netinit-docker - the only thing that gives this
    # container a default route at all. Losing it just means scrape/crawl jobs fail
    # closed (no DNS/route out) instead of silently reaching nowhere - same fail-closed
    # shape as code-docker-chrome's own use of this label.
    labels:
      netinit.provider: "${PREFIX:-}code-docker-netinit-docker"
    environment:
      # Fails the whole `docker compose up` loudly if unset, rather than starting with
      # nginx-gate silently 401ing everything - ootb.sh/migrate.sh always set this via
      # OOTB_GENERATE_SECRETS, so an unset value here means a hand-rolled deployment that
      # skipped that step.
      FIRECRAWL_TOKEN: "${FIRECRAWL_TOKEN:?FIRECRAWL_TOKEN is required - run ootb.sh/migrate.sh, or set it in code-docker's .env}"
      FIRECRAWL_GATE_PORT: "${FIRECRAWL_GATE_PORT:-3002}"
      FIRECRAWL_API_PORT: "${FIRECRAWL_API_PORT:-3902}"
      FIRECRAWL_PLAYWRIGHT_PORT: "${FIRECRAWL_PLAYWRIGHT_PORT:-3000}"
      POSTGRES_USER: "${FIRECRAWL_POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${FIRECRAWL_POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${FIRECRAWL_POSTGRES_DB:-postgres}"
      FIRECRAWL_NUM_WORKERS: "${FIRECRAWL_NUM_WORKERS:-8}"
      FIRECRAWL_CRAWL_CONCURRENT_REQUESTS: "${FIRECRAWL_CRAWL_CONCURRENT_REQUESTS:-10}"
      FIRECRAWL_MAX_CONCURRENT_JOBS: "${FIRECRAWL_MAX_CONCURRENT_JOBS:-5}"
      FIRECRAWL_BROWSER_POOL_SIZE: "${FIRECRAWL_BROWSER_POOL_SIZE:-5}"
      # Passed straight to playwright-service. ALLOW_LOCAL_WEBHOOKS lets webhook URLs
      # point at private/loopback addresses (leave unset unless you need that), BLOCK_MEDIA
      # drops image/font/media requests during rendering to save bandwidth.
      FIRECRAWL_ALLOW_LOCAL_WEBHOOKS: "${FIRECRAWL_ALLOW_LOCAL_WEBHOOKS:-}"
      FIRECRAWL_BLOCK_MEDIA: "${FIRECRAWL_BLOCK_MEDIA:-}"
      # Optional - only used by the LLM-backed /extract endpoint. Blank means that
      # endpoint 400s; scrape/crawl/map are unaffected.
      FIRECRAWL_OPENAI_API_KEY: "${FIRECRAWL_OPENAI_API_KEY:-}"
      FIRECRAWL_OPENAI_BASE_URL: "${FIRECRAWL_OPENAI_BASE_URL:-}"
      FIRECRAWL_MODEL_NAME: "${FIRECRAWL_MODEL_NAME:-}"
      # dns-local's second upstream (alongside Docker's own 127.0.0.11) - see
      # code-docker's own CLAUDE.md, "netshare" section.
      ROUTER_HOSTNAME: "${ROUTER_HOSTNAME:-router}"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "${FIRECRAWL_CPU_LIMIT:-4}"
          memory: "${FIRECRAWL_MEM_LIMIT:-8g}"
    volumes:
      # Named, not a ./data bind mount - kept out of this repo's own directory for the
      # same reason code-docker-trilium's README recommends an absolute TRILIUM_VOLUME:
      # builds/ is the kind of place people `rm -rf` while cleaning up a checkout.
      - firecrawl-postgres-data:/data/postgres
    networks:
      firecrawl: {}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- The one bridge between the two networks - see the TODO in the header comment ----

  firecrawl-front:
    # nginx-unprivileged, not plain nginx: it never needs to bind <1024 or drop from root
    # to an unprivileged user at startup, so `cap_drop: ALL` below actually holds.
    image: "nginxinc/nginx-unprivileged:1.27-alpine"
    container_name: "${PREFIX:-}code-docker-firecrawl-front"
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/firecrawl-front/entrypoint.sh"]
    environment:
      FIRECRAWL_GATE_PORT: "${FIRECRAWL_GATE_PORT:-3002}"
    volumes:
      - "./docker/firecrawl-proxy:/firecrawl-front:ro"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      # Reachable from code-docker (and anything else on code-docker-internal) at
      # http://firecrawl:3002 - the AIO container's own nginx-gate is what actually
      # checks the bearer token; this container just forwards.
      code-docker-internal:
        aliases:
          - firecrawl
      firecrawl: {}
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---- Field merges into services this file does not define ----

  # Hands the token + URL to the actual consumer. code-docker has no idea this project
  # exists (that's the point of EXTRA_INCLUDE), so without this merge both variables
  # would be empty inside the agent's environment - same shape as roblox-studio-docker's
  # MCP_TOKEN merge and code-docker-chrome's CHROME_CDP_TOKEN merge.
  code-docker:
    environment:
      FIRECRAWL_API_URL: "http://firecrawl:${FIRECRAWL_GATE_PORT:-3002}"
      FIRECRAWL_TOKEN: "${FIRECRAWL_TOKEN:-}"

  # router has to join `firecrawl` itself for two reasons: it is the network's declared
  # netinit.gateway (a container's default route can only point at a container actually
  # present on the same L2 segment), and dns-local (inside the AIO container) resolves it
  # by the alias below as its second DNS upstream.
  code-docker-router:
    networks:
      firecrawl:
        aliases:
          - "${ROUTER_HOSTNAME:-router}"

networks:
  # No pinned subnet/ip_range anymore - see the header comment. Docker's usual
  # auto-assigned subnet is fine now that nothing here needs a stable, known-in-advance
  # IP address.
  firecrawl:
    name: "${PREFIX:-}code-docker-firecrawl"
    internal: true
    labels:
      netinit.provider: "${PREFIX:-}code-docker-netinit-docker"
      netinit.gateway: "${PREFIX:-}code-docker-router"
      netinit.exempt-forward: "true"

volumes:
  firecrawl-postgres-data:
    name: "${PREFIX:-}code-docker-firecrawl-postgres-data"
