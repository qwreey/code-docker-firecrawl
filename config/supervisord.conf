[supervisord]
loglevel=info
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# One [program:...] file per process, matching code-docker-chrome's own split. No
# gitignored override glob here either - this image has no user-override mechanism
# anywhere else, same reasoning as chrome.
[include]
files = /etc/code-docker-firecrawl/supervisord.d/*.conf
