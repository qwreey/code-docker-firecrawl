# priority=30 - after postgres is actually accepting connections (firecrawl-service.sh
# blocks on pg_isready itself, see that script; supervisord's own priority ordering only
# controls start *order*, not readiness, so the wait still has to happen in-script) and
# after playwright (its own URL is read from PLAYWRIGHT_MICROSERVICE_URL at request time,
# not at harness startup, so this ordering is a nicety rather than a hard requirement).
#
# Runs as `node`, same as playwright - this is upstream's own harness
# (`node dist/src/harness.js --start-docker`), which forks api/worker/extract-worker/
# nuq-workers/nuq-prefetch-worker/nuq-reconciler-worker itself and forwards SIGTERM to all
# of them on its own shutdown path (apps/api/src/harness.ts's gracefulShutdown) - so
# stopping this one supervisord program is enough to stop the whole process tree
# underneath it. A generous stopwaitsecs gives that drain-and-terminate sequence room to
# finish instead of being SIGKILLed mid-shutdown.
[program:firecrawl]
command=/etc/code-docker-firecrawl/firecrawl-service.sh
user=node
priority=30
autorestart=true
stopwaitsecs=30
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
