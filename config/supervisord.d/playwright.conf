# priority=20 - after dns-local/postgres/redis, before the api harness (which depends on
# it via PLAYWRIGHT_MICROSERVICE_URL). Runs as the `node` user (same as upstream's own
# Dockerfile, which also runs this service as `node` rather than root) - chromium is
# launched with --no-sandbox by playwright-service's own code regardless of uid, so there
# is no sandbox-vs-root conflict the way code-docker-chrome's browser has.
[program:playwright]
command=/etc/code-docker-firecrawl/playwright-service.sh
user=node
priority=20
autorestart=true
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
