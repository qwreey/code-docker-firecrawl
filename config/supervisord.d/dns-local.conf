# priority=5 - before anything that resolves an external name. Both firecrawl-api and
# playwright-service fetch whatever URL a scrape/crawl job gives them, which is exactly
# the class of lookup Docker's embedded DNS SERVFAILs on an `internal: true` network - see
# dns-local-service.sh.
[program:dns-local]
command=/etc/code-docker-firecrawl/dns-local-service.sh
priority=5
autorestart=true
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
