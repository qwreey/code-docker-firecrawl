# priority=10 - after dns-local (postgres itself needs no DNS, but starting order stays
# monotonic with "things that resolve names" first, "things that store data" second,
# "things that fetch URLs" third for readability of the process list). Runs as the
# unprivileged `postgres` system user the apt package already created - entrypoint.sh
# chowns the data volume to that user before supervisord ever starts this.
[program:postgres]
command=/etc/code-docker-firecrawl/postgres-service.sh
user=postgres
priority=10
autorestart=true
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
