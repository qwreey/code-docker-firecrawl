# priority=10, same tier as postgres - see that file's comment. Runs as the unprivileged
# `redis` system user the apt package created.
#
# No persistence (see redis-service.sh) - nuq's own job queue lives in postgres, which is
# the actual source of truth this stack cares about surviving a restart. Redis here only
# backs rate limiting and a couple of optional caches (see apps/api/src/config.ts's
# REDIS_RATE_LIMIT_URL/INDEX_CACHE_REDIS_URL/SPUR_REDIS_URL) - losing that on restart just
# resets rate-limit counters, which upstream's own docker-compose.yaml already accepts
# (its `redis` service carries no volume either).
[program:redis]
command=/etc/code-docker-firecrawl/redis-service.sh
user=redis
priority=10
autorestart=true
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
