# priority=80 - last. Starting before firecrawl-api exists is fine (nginx just 502s until
# the upstream is reachable, same reasoning the old firecrawl-front's `resolver` comment
# used to give for IP changes - the difference here is the upstream is a stable loopback
# address, not a container name, so there is no re-resolution problem to design around at
# all). Runs as root: nginx's own package already does the root-master/www-data-worker
# privilege drop internally (see nginx.conf's own `user www-data;`), so no supervisor
# `user=` is needed or wanted here.
[program:nginx-gate]
command=/etc/code-docker-firecrawl/nginx-gate-service.sh
priority=80
autorestart=true
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
